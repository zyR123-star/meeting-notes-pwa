<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4F6EF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>多多速记</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  color-scheme:light dark;--primary:#4F6EF7;--primary-soft:#edf0ff;--pink:#ff8fba;--pink-soft:#fff0f6;
  --mint:#71cfb9;--mint-soft:#ecfbf7;--bg:#fff8fb;--surface:#fffefe;--surface2:#fff7fa;--text:#41374e;
  --muted:#83768c;--line:#f0dce5;--danger:#d93c4f;--success:#18865b;--shadow:0 10px 28px rgba(128,73,107,.1)
}
@media(prefers-color-scheme:dark){:root{
  --primary:#8ea0ff;--primary-soft:#282b4d;--pink:#ff9fc4;--pink-soft:#3b2633;--mint:#75d8c0;--mint-soft:#1d3733;
  --bg:#15131b;--surface:#211d28;--surface2:#2b2532;--text:#fbf7fc;--muted:#c1b7c7;--line:#423747;--danger:#ff8291
}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.55;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.app{width:min(100%,760px);min-height:100vh;margin:auto;padding:0 16px 36px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;min-height:68px;padding:calc(10px + env(safe-area-inset-top)) 0 10px;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(14px)}
.brand-mascot{width:48px;height:48px;flex:none;filter:drop-shadow(0 4px 5px rgba(106,72,103,.12))}.brand-mascot svg{display:block;width:100%;height:100%}.title-copy{flex:1;min-width:0}
.topbar h1{flex:1;min-width:0;margin:0;font-size:20px;line-height:1.25}.topbar p{margin:2px 0 0;color:var(--muted);font-size:12px}
.icon-btn{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:20px}
.view{animation:in .18s ease-out}@keyframes in{from{opacity:.45;transform:translateY(4px)}}
.welcome{position:relative;display:flex;align-items:center;gap:12px;overflow:hidden;margin:2px 0 14px;padding:16px;border:1px solid #ffd5e6;border-radius:14px;background:var(--pink-soft)}
.welcome::after{content:"✦";position:absolute;right:14px;top:10px;color:#ffd56a;font-size:24px}.welcome-sticker{width:48px;height:48px;flex:none;display:grid;place-items:center;color:#fff;font-size:25px;background:var(--pink);border:2px solid color-mix(in srgb,var(--pink) 65%,#9d5879);border-radius:50%}
.welcome span{display:block;color:var(--pink);font-size:10px;font-weight:800;letter-spacing:.12em}.welcome h2{margin:2px 0 0;font-size:16px;line-height:1.45}.welcome p{margin:3px 0 0;color:var(--muted);font-size:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:2px 0 13px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tabs button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:700}.tabs button.active{background:var(--primary);color:#fff}
.searchline{display:grid;grid-template-columns:1fr auto;gap:9px;margin-bottom:13px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:11px 13px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%,transparent)}
textarea{resize:vertical;min-height:170px;line-height:1.65}
.btn,.primary,.secondary,.danger{border:1px solid transparent;border-radius:14px;min-height:44px;padding:10px 14px;font-weight:700}
.primary{background:var(--primary);color:#fff}.secondary{background:var(--surface);border-color:var(--line)}.danger{background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,var(--line))}
button:disabled{opacity:.45;cursor:not-allowed}
.stack{display:grid;gap:11px}.card,.panel{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:15px;box-shadow:0 1px 0 rgba(30,40,70,.02)}
.card{position:relative;overflow:hidden}.card:not(.course-card){border-top:3px solid var(--pink)}.card:not(.course-card):nth-child(3n+2){border-top-color:var(--primary)}.card:not(.course-card):nth-child(3n){border-top-color:var(--mint)}.card::after{content:"✦";position:absolute;right:11px;top:8px;color:#ffd56a;font-size:15px}
.card h2,.panel h2{margin:0 0 7px;font-size:17px}.panel{display:grid;gap:12px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:9px}
.course-card{display:grid;gap:12px;border-top:4px solid var(--course,var(--primary))}.course-head{display:flex;align-items:flex-start;gap:10px}.dot{width:14px;height:14px;flex:none;margin-top:5px;border-radius:50%;background:var(--course,var(--primary))}
.course-title{flex:1;min-width:0}.course-title h2{margin:0}.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:5px 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{padding:3px 8px;border-radius:999px;background:var(--pink-soft);color:#a44f75;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}.actions .grow{flex:1}.tiny{font-size:12px;color:var(--muted)}
.lesson-list{display:grid;gap:7px}.lesson{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.lesson:first-child{border-top:0}.lesson-no{font-weight:800;color:var(--primary)}.lesson-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{font-size:11px;border-radius:999px;padding:2px 7px;background:var(--mint-soft);color:var(--success)}.state.draft{background:var(--pink-soft);color:#a44f75}
.empty{padding:50px 12px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:5px}
.form{display:grid;gap:14px}.field{display:grid;gap:6px}.field>span{font-size:13px;font-weight:700;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{min-height:20px;color:var(--muted);font-size:13px;white-space:pre-wrap}
.audio-meta{display:flex;justify-content:space-between;gap:8px}.player{width:100%;height:44px}
.marker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.marker-grid button{min-height:44px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.directory{display:grid;gap:6px}.entry{display:grid;grid-template-columns:60px 1fr;gap:9px;width:100%;padding:9px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.entry:first-child{border-top:0}.entry time{color:var(--primary);font-weight:800}.transcript-row.active{background:var(--primary-soft)}.entry-label{font-size:11px;color:var(--pink)}
.markdown{overflow-wrap:anywhere}.markdown table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}.markdown th,.markdown td{border:1px solid var(--line);padding:7px;text-align:left}
.markdown pre{padding:12px;border-radius:10px;background:var(--surface2);overflow:auto}.markdown code{padding:2px 4px;border-radius:4px;background:var(--surface2)}
.record-bar{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;width:min(calc(100% - 24px),720px);transform:translateX(-50%);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:#43394e;color:#fff;box-shadow:0 12px 36px rgba(0,0,0,.28)}
.volume{height:34px;display:flex;align-items:flex-end;gap:3px}.volume i{flex:1;min-width:3px;height:5px;border-radius:4px;background:#8fc9ff;transition:height .08s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:50;max-width:calc(100% - 30px);transform:translate(-50%,16px);opacity:0;pointer-events:none;padding:10px 14px;border-radius:12px;background:#54435b;color:#fff;box-shadow:var(--shadow);transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:420px){.row{grid-template-columns:1fr}.marker-grid{grid-template-columns:1fr 1fr}.topbar h1{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <button id="backBtn" class="icon-btn" type="button" aria-label="返回" hidden>←</button>
  <div class="brand-mascot" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M15 47C7 47 3 41 5 35c1-5 5-8 10-8 2-11 18-16 25-6 8-2 14 4 14 11 0 9-7 15-16 15H15z" fill="#fff" stroke="#5b526b" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="36" r="2.5" fill="#5b526b"/><circle cx="40" cy="36" r="2.5" fill="#5b526b"/><path d="M27 42c3 3 7 3 10 0" fill="none" stroke="#5b526b" stroke-width="2.5" stroke-linecap="round"/><path d="M43 13c-6-6-11 1-4 6-7 5-2 11 4 6 6 5 11-1 4-6 7-5 2-12-4-6z" fill="#ff8fba" stroke="#b75c83" stroke-width="2" stroke-linejoin="round"/><path d="M12 22l1.5 3 3 .8-3 1.5-.8 3-1.5-3-3-.8 3-1.5z" fill="#ffd56a"/></svg></div>
  <div class="title-copy"><h1 id="pageTitle">多多速记</h1><p id="pageSub">课堂与会议，一次记清楚</p></div>
  <button id="settingsBtn" class="icon-btn" type="button" aria-label="设置">⚙</button>
</header>
<main>
<section id="homeView" class="view">
  <div class="welcome"><div class="welcome-sticker">♡</div><div><span>DUODUO'S NOTEBOOK</span><h2>多多，今天也要把重要的话收好呀。</h2><p>课堂和会议，都慢慢变成闪光的记录。</p></div></div>
  <div class="tabs"><button id="meetTab" type="button" data-mode="meet">会议</button><button id="courseTab" class="active" type="button" data-mode="course">课程</button></div>
  <div class="searchline"><input id="searchInput" type="search" placeholder="搜索标题、正文、笔记或标签"><button id="createBtn" class="primary" type="button">＋</button></div>
  <div id="homeList" class="stack"></div>
  <div class="actions" style="margin-top:16px"><button id="backupBtn" class="secondary" type="button">导出备份 JSON</button><label class="secondary btn">恢复备份<input id="restoreInput" type="file" accept=".json,application/json" hidden></label></div>
</section>
<section id="courseView" class="view" hidden>
  <form id="courseForm" class="form">
    <label class="field"><span>课程名称</span><input id="courseName" required></label>
    <div class="row"><label class="field"><span>老师</span><input id="courseTeacher"></label><label class="field"><span>学期</span><input id="courseTerm" placeholder="2026 秋季"></label></div>
    <label class="field"><span>课程颜色</span><input id="courseColor" type="color" value="#4F6EF7"></label>
    <button class="primary" type="submit">保存课程</button>
  </form>
</section>
<section id="detailView" class="view" hidden>
  <form id="detailForm" class="form">
    <div><h2 id="detailHeading" style="margin:0 0 4px">课时详情</h2><div id="detailMeta" class="tiny"></div></div>
    <label class="field"><span>标题</span><input id="titleInput" required></label>
    <div class="row"><label class="field"><span>日期</span><input id="dateInput" type="date"></label><label class="field"><span>状态</span><select id="statusInput"><option value="draft">未整理</option><option value="reviewed">已复习</option></select></label></div>
    <label class="field"><span>标签（逗号分隔）</span><input id="tagsInput"></label>
    <label class="field"><span>相关人（逗号分隔）</span><input id="peopleInput"></label>
    <section class="panel">
      <h2>速记正文</h2><textarea id="bodyInput" placeholder="上课时记录的知识点、例题和作业"></textarea>
      <details><summary>语音草稿</summary><textarea id="draftInput" placeholder="可先用系统语音识别记录草稿"></textarea><div class="actions" style="margin-top:8px"><button id="draftSpeechBtn" class="secondary" type="button">开始语音草稿</button><button id="draftApplyBtn" class="secondary" type="button">用草稿覆盖正文</button></div></details>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>录音</h2><button id="recordBtn" class="primary" type="button">开始录音</button></div>
      <div class="audio-meta"><span id="audioInfo" class="tiny">暂无录音</span><span class="tiny">保持前台，建议关闭自动锁屏</span></div>
      <audio id="player" class="player" controls preload="metadata" hidden></audio>
      <div id="audioStatus" class="status"></div>
      <button id="transcribeBtn" class="secondary" type="button">录音转写</button>
    </section>
    <section class="panel">
      <h2>时间戳目录</h2>
      <div id="markerButtons" class="marker-grid"><button type="button" data-label="重点">重点</button><button type="button" data-label="例题">例题</button><button type="button" data-label="疑问">疑问</button><button type="button" data-label="作业">作业</button></div>
      <div id="directory" class="directory"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 id="noteHeading">AI 笔记</h2><button id="noteBtn" class="primary" type="button">生成笔记</button></div>
      <div id="noteStatus" class="status"></div><div id="noteView" class="markdown"><span class="tiny">暂无笔记</span></div>
    </section>
    <div class="actions"><button id="exportBtn" class="secondary" type="button">导出 Markdown</button><button id="deleteBtn" class="danger" type="button">删除记录</button></div>
  </form>
</section>
<section id="settingsView" class="view" hidden>
  <form id="settingsForm" class="form">
    <label class="field"><span>服务商预设</span><select id="providerInput"><option value="siliconflow">硅基流动（SenseVoiceSmall）</option><option value="groq">Groq（whisper-large-v3-turbo）</option><option value="openai">OpenAI（gpt-4o-mini-transcribe）</option><option value="custom">自定义</option></select></label>
    <label class="field"><span>识别语言</span><select id="languageInput"><option value="auto">自动检测</option><option value="zh">中文</option><option value="en">English</option></select></label>
    <label class="field"><span>笔记 Base URL</span><input id="baseUrlInput" type="url"></label>
    <label class="field"><span>转写 Base URL</span><input id="asrBaseUrlInput" type="url"></label>
    <div class="row"><label class="field"><span>笔记 API Key</span><input id="apiKeyInput" type="password" autocomplete="off"></label><label class="field"><span>转写 API Key</span><input id="asrApiKeyInput" type="password" autocomplete="off"></label></div>
    <div class="row"><label class="field"><span>笔记模型</span><input id="chatModelInput"></label><label class="field"><span>转写模型</span><input id="asrModelInput"></label></div>
    <label class="field"><span>热词</span><textarea id="hotwordsInput" style="min-height:100px" placeholder="课程名、专业术语、人名，用逗号分隔"></textarea></label>
    <div class="actions"><button class="primary" type="submit">保存设置</button><button id="clearAudioBtn" class="danger" type="button">清理全部音频保留文字</button></div>
    <div id="storageInfo" class="tiny"></div><div id="settingsStatus" class="status"></div><p class="tiny" style="margin:0">版本 2.0.10</p>
  </form>
</section>
</main>
</div>
<div id="recordBar" class="record-bar" hidden><strong id="recordTime">00:00</strong><div id="volume" class="volume"></div><button id="recordStopBtn" class="danger" type="button">结束</button></div>
<div id="toast" class="toast" role="status"></div>
<script>
(()=>{
"use strict";
const DB_NAME="mtx",DB_VERSION=1,CONFIG_KEY="mtx-settings",COURSE_PROMPT="你是课程助教。把下面的内容整理为Markdown笔记,严格使用这些小节,不加客套话:## 一句话概要(≤60字)/## 知识要点(分条)/## 关键概念定义/## 公式定理(用代码块原样保留)/## 例题讲解/## 作业与截止(表格:任务|截止)/## 待验证疑问(学生可能不懂的地方)。语言与原文一致";
const MEETING_PROMPT="将会议内容整理为Markdown纪要,含:##摘要(≤100字)/##关键决议/##待办(表格:事项|负责人|截止)/##风险,语言与原文一致";
const PRESETS={siliconflow:{baseURL:"https://api.siliconflow.cn/v1",asrBaseURL:"https://api.siliconflow.cn/v1",chatModel:"",asrModel:"FunAudioLLM/SenseVoiceSmall"},groq:{baseURL:"https://api.groq.com/openai/v1",asrBaseURL:"https://api.groq.com/openai/v1",chatModel:"",asrModel:"whisper-large-v3-turbo"},openai:{baseURL:"https://api.openai.com/v1",asrBaseURL:"https://api.openai.com/v1",chatModel:"gpt-4o-mini",asrModel:"gpt-4o-mini-transcribe"},custom:{baseURL:"",asrBaseURL:"",chatModel:"",asrModel:""}};
const $=id=>document.getElementById(id);
  const els=["backBtn","settingsBtn","pageTitle","pageSub","homeView","meetTab","courseTab","searchInput","createBtn","homeList","backupBtn","restoreInput","courseView","courseForm","courseName","courseTeacher","courseTerm","courseColor","detailView","detailForm","detailHeading","detailMeta","titleInput","dateInput","statusInput","tagsInput","peopleInput","bodyInput","draftInput","draftSpeechBtn","draftApplyBtn","recordBtn","audioInfo","player","audioStatus","transcribeBtn","markerButtons","directory","noteHeading","noteBtn","noteStatus","noteView","exportBtn","deleteBtn","settingsView","settingsForm","providerInput","languageInput","baseUrlInput","asrBaseUrlInput","apiKeyInput","chatModelInput","asrModelInput","hotwordsInput","clearAudioBtn","storageInfo","settingsStatus","recordBar","recordTime","volume","recordStopBtn","toast"].reduce((o,id)=>(o[id]=$(id),o),{});
const state={mode:"course",view:"home",query:"",meeting:null,course:null,courses:[],meetings:[],audioUrl:"",saveTimer:0,tickTimer:0,speech:null,speechAt:null,recording:null};
let db;
const request=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const all=store=>request(db.transaction(store).objectStore(store).getAll());
const one=(store,key)=>request(db.transaction(store).objectStore(store).get(key));
const put=(store,value)=>request(db.transaction(store,"readwrite").objectStore(store).put(value));
const del=(store,key)=>request(db.transaction(store,"readwrite").objectStore(store).delete(key));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const split=v=>[...new Set(v.split(/[,，]/).map(x=>x.trim()).filter(Boolean))];
const escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const durationLabel=ms=>{const n=Math.max(0,Math.floor((ms||0)/1000));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")};
function toast(msg){els.toast.textContent=String(msg||"").slice(0,140);els.toast.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>els.toast.classList.remove("show"),2600)}
function fail(error){toast(String(error?.message||error?.name||error||"操作失败").slice(0,140))}
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("meetings"))d.createObjectStore("meetings",{keyPath:"id"});if(!d.objectStoreNames.contains("courses"))d.createObjectStore("courses",{keyPath:"id"});if(!d.objectStoreNames.contains("audio")){const s=d.createObjectStore("audio",{keyPath:"id"});s.createIndex("meetingId","meetingId")}};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function migrateOld(){if(localStorage.getItem("mtx-migrated"))return;let created=false;const old=await new Promise(resolve=>{const r=indexedDB.open("meeting-notes-db");r.onupgradeneeded=()=>{created=true};r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)});if(!old||created){old?.close();localStorage.setItem("mtx-migrated","1");return}try{if(!["meetings","recordings","settings"].every(s=>old.objectStoreNames.contains(s))){localStorage.setItem("mtx-migrated","1");return}const tx=old.transaction(["meetings","recordings","settings"]);const [meetings,recordings,settings]=await Promise.all(["meetings","recordings","settings"].map(s=>request(tx.objectStore(s).getAll())));const grouped={};recordings.sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||"")).forEach(r=>{(grouped[r.meetingId]??=[]).push(r)});for(const m of meetings){const audios=grouped[m.id]||[];let start=0;for(const a of audios){await put("audio",{id:a.id,meetingId:m.id,blob:a.blob,start});start+=(a.duration||0)*1000}await put("meetings",{id:m.id,mode:"meet",courseId:null,lessonNo:null,title:m.title||"未命名会议",date:m.date||today(),tags:m.tags||[],people:m.attendees||[],body:m.body||"",draft:"",transcript:[],markers:[],note:"",status:m.status||"draft",duration:start,chunks:audios.length,updatedAt:m.updatedAt||new Date().toISOString()})}const oldConfig=settings.find(s=>s.key==="ai");if(oldConfig&&!localStorage.getItem(CONFIG_KEY))localStorage.setItem(CONFIG_KEY,JSON.stringify({provider:"custom",baseURL:oldConfig.baseURL||"",asrBaseURL:oldConfig.baseURL||"",apiKey:oldConfig.apiKey||"",chatModel:oldConfig.model||"",asrModel:oldConfig.sttModel||"",hotwords:""}));localStorage.setItem("mtx-migrated","1")}catch(error){toast("旧数据迁移失败："+(error.message||error).slice(0,100))}finally{old.close()}}

function markdown(src){const blocks=[];let s=String(src||"").replace(/```([\s\S]*?)```/g,(_,x)=>`@@${blocks.push(`<pre><code>${escape(x.trim())}</code></pre>`)-1}@@`);const lines=s.split(/\r?\n/);let out="",list=false;const close=()=>{if(list){out+="</ul>";list=false}};for(let i=0;i<lines.length;i++){const line=lines[i];if(/^@@\d+@@$/.test(line)){close();out+=blocks[Number(line.match(/\d+/)[0])];continue}const h=line.match(/^(#{2,4})\s+(.+)$/);if(h){close();out+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;continue}if(/^\s*[-*]\s+/.test(line)){if(!list){out+="<ul>";list=true}out+=`<li>${inline(line.replace(/^\s*[-*]\s+/,""))}</li>`;continue}if(/^\s*\|.+\|\s*$/.test(line)&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]||"")){close();const rows=[];while(i<lines.length&&/^\s*\|.+\|\s*$/.test(lines[i])){const cells=lines[i].trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());if(!/^[\s:|-]+$/.test(cells.join("")))rows.push(cells);i++}i--;out+="<table>"+rows.map((row,ri)=>`<tr>${row.map(x=>`<${ri?"td":"th"}>${inline(x)}</${ri?"td":"th"}>`).join("")}</tr>`).join("")+"</table>";continue}if(!line.trim()){close();continue}close();out+=`<p>${inline(line)}</p>`}close();return out||'<span class="tiny">暂无笔记</span>'}
function renderNote(){els.noteView.innerHTML=state.meeting?.note?markdown(state.meeting.note):'<span class="tiny">暂无笔记</span>'}
function meetingMarkdown(m){const course=state.courses.find(c=>c.id===m.courseId);const markers=(m.markers||[]).sort((a,b)=>a.t-b.t).map(x=>`- ${durationLabel(x.t)} [${x.label}] ${x.text||""}`).join("\n");const transcript=(m.transcript||[]).sort((a,b)=>a.t-b.t).map(x=>`**${durationLabel(x.t)}** ${x.s}`).join("\n\n");return `# ${m.title}\n\n- ${m.mode==="course"?"课程":"类型"}：${course?.name||"会议"}\n- 老师：${course?.teacher||""}\n- 日期：${m.date}\n- 时长：${durationLabel(m.duration)}\n\n## 时间戳目录\n\n${markers||"无"}\n\n## 速记正文\n\n${m.body||"无"}\n\n## 转写全文\n\n${transcript||"无"}\n\n## ${m.mode==="course"?"AI 笔记":"AI 纪要"}\n\n${m.note||"无"}\n`}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function confirmDelete(){if(state.recording)return toast("请先结束录音");const first=confirm("确定删除这条记录吗？\n\n音频、转写和笔记都会一起删除。");if(!first||!confirm("请再次确认删除。"))return;const tx=db.transaction(["meetings","audio"],"readwrite");tx.objectStore("meetings").delete(state.meeting.id);const c=tx.objectStore("audio").index("meetingId").openCursor(IDBKeyRange.only(state.meeting.id));c.onsuccess=()=>{const x=c.result;if(x){x.delete();x.continue()}};await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});if(state.audioUrl){URL.revokeObjectURL(state.audioUrl);state.audioUrl=""}state.meeting=null;await loadData();setView("home")}
async function exportBackup(){const [meetings,courses,audio]=await Promise.all([all("meetings"),all("courses"),all("audio")]);const enc=await Promise.all(audio.map(async a=>({...a,blob:await blobUrl(a.blob)})));download(`课堂速记备份-${today()}.json`,JSON.stringify({version:2,meetings,courses,audio:enc,settings:getConfig()}),"application/json")}
const blobUrl=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(b)});
async function restoreBackup(e){const file=e.target.files[0];e.target.value="";if(!file||!confirm("恢复备份会覆盖当前全部数据，是否继续？"))return;try{const p=JSON.parse(await file.text());if(p.version!==2||!Array.isArray(p.meetings)||!Array.isArray(p.courses)||!Array.isArray(p.audio))throw new Error("备份格式不正确");const audio=await Promise.all(p.audio.map(async a=>({...a,blob:await(await fetch(a.blob)).blob()})));const tx=db.transaction(["meetings","courses","audio"],"readwrite");["meetings","courses","audio"].forEach(s=>tx.objectStore(s).clear());p.meetings.forEach(x=>tx.objectStore("meetings").put(x));p.courses.forEach(x=>tx.objectStore("courses").put(x));audio.forEach(x=>tx.objectStore("audio").put(x));await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});if(p.settings)saveConfig(p.settings);await loadData();toast("备份已恢复")}catch(err){fail(err)}}
async function clearAudio(){if(!confirm("清理全部音频并保留会议、转写和笔记？此操作不可撤销。"))return;await request(db.transaction("audio","readwrite").objectStore("audio").clear());for(const m of state.meetings){m.duration=0;m.chunks=0;await put("meetings",m)}await storageInfo();toast("全部音频已清理")}
async function storageInfo(){try{const e=await navigator.storage.estimate();els.storageInfo.textContent=`已用 ${(e.usage/1024/1024).toFixed(1)} MB / 可用 ${(e.quota/1024/1024).toFixed(0)} MB`}catch{els.storageInfo.textContent="浏览器未提供存储统计"}}
function fillSettings(){const c=getConfig();els.providerInput.value=c.provider||"custom";els.languageInput.value=c.language||"auto";els.baseUrlInput.value=c.baseURL;els.asrBaseUrlInput.value=c.asrBaseURL;els.apiKeyInput.value=c.apiKey;$("asrApiKeyInput").value=c.asrApiKey||"";els.chatModelInput.value=c.chatModel;els.asrModelInput.value=c.asrModel;els.hotwordsInput.value=c.hotwords;storageInfo()}
function applyPreset(){const p=PRESETS[els.providerInput.value];if(!p)return;els.baseUrlInput.value=p.baseURL;els.asrBaseUrlInput.value=p.asrBaseURL;els.chatModelInput.value=p.chatModel;els.asrModelInput.value=p.asrModel}
function bind(){[...els.markerButtons.children].forEach(b=>b.disabled=true);els.meetTab.onclick=()=>{state.mode="meet";renderHome()};els.courseTab.onclick=()=>{state.mode="course";renderHome()};els.searchInput.oninput=e=>{state.query=e.target.value;renderHome()};els.createBtn.onclick=()=>state.mode==="meet"?newMeeting("meet"):editCourse("");els.homeList.onclick=e=>{const open=e.target.closest("[data-open]"),add=e.target.closest("[data-add-lesson]"),edit=e.target.closest("[data-edit-course]");if(open)openDetail(open.dataset.open);if(add)newMeeting("course",add.dataset.addLesson);if(edit)editCourse(edit.dataset.editCourse)};els.backBtn.onclick=async()=>{if(state.recording)return toast("请先结束录音");stopSpeech();if(state.view==="detail"){await persistMeeting();await loadData()}setView("home")};els.settingsBtn.onclick=()=>{fillSettings();setView("settings")};els.courseForm.onsubmit=saveCourse;els.detailForm.oninput=scheduleSave;els.detailForm.onchange=scheduleSave;els.draftSpeechBtn.onclick=toggleDraftSpeech;els.draftApplyBtn.onclick=()=>{if(!els.draftInput.value.trim())return toast("草稿为空");els.bodyInput.value=els.draftInput.value;scheduleSave();toast("已覆盖正文")};els.recordBtn.onclick=startRecording;els.recordStopBtn.onclick=stopRecording;els.transcribeBtn.onclick=transcribe;els.noteBtn.onclick=generateNote;els.markerButtons.onclick=e=>{const b=e.target.closest("[data-label]");if(b)addMarker(b.dataset.label)};els.directory.onclick=e=>{const b=e.target.closest("[data-seek]");if(b){b.classList.add("active");seek(Number(b.dataset.seek))}};els.exportBtn.onclick=()=>{syncMeeting();download((state.meeting.title||"课堂速记").replace(/[\\/:*?"<>|]/g,"_")+".md",meetingMarkdown(state.meeting),"text/markdown")};els.deleteBtn.onclick=confirmDelete;els.backupBtn.onclick=exportBackup;els.restoreInput.onchange=restoreBackup;els.settingsForm.onsubmit=e=>{e.preventDefault();saveConfig({provider:els.providerInput.value,baseURL:els.baseUrlInput.value.trim().replace(/\/+$/,""),asrBaseURL:els.asrBaseUrlInput.value.trim().replace(/\/+$/,""),apiKey:els.apiKeyInput.value.trim(),chatModel:els.chatModelInput.value.trim(),asrModel:els.asrModelInput.value.trim(),hotwords:els.hotwordsInput.value.trim()});els.settingsStatus.textContent="设置已保存";toast("设置已保存")};els.providerInput.onchange=applyPreset;els.clearAudioBtn.onclick=clearAudio;window.onbeforeunload=()=>{if(state.meeting)syncMeeting();stopSpeech();if(state.audioUrl)URL.revokeObjectURL(state.audioUrl)}}
document.addEventListener("input",e=>{if(e.target.id==="asrApiKeyInput"){const c=getConfig();c.asrApiKey=e.target.value.trim();saveConfig(c)}});
document.addEventListener("change",e=>{if(e.target.id==="languageInput"){const c=getConfig();c.language=e.target.value;saveConfig(c)}});
async function init(){try{db=await openDB();await migrateOld();bind();await loadData();if("serviceWorker"in navigator){let refreshing=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!refreshing){refreshing=true;location.reload()}});navigator.serviceWorker.register("sw.js?v=2.0.10").then(r=>r.update()).catch(()=>{})}}catch(e){document.body.innerHTML=`<div class="empty"><strong>应用初始化失败</strong><p>${escape(e?.message||String(e))}</p><p class="tiny">${location.protocol==="file:"?"请通过 HTTP 服务打开，不要双击 HTML。":"请在浏览器控制台查看完整错误。"}</p></div>`}}
init();
})();
</script>
